version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      types:
        patterns: ['@types/*']
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*']
      testing:
        patterns: ['vitest*', '@vitest/*', 'supertest', 'mongodb-memory-server']
      radix-ui:
        patterns: ['@radix-ui/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    commit-message:
      prefix: build(docker)
