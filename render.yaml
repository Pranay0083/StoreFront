services:
  - type: web
    name: storefront-api
    runtime: node
    buildCommand: npm ci --workspace backend --include-workspace-root=false
    startCommand: npm run start -w backend
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: storefront
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
