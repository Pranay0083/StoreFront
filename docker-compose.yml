services:
  backend:
    image: ghcr.io/pranay0083/storefront-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storefront-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4001"
      HOST: "0.0.0.0"
    ports:
      - "4001:4001"

  frontend:
    image: ghcr.io/pranay0083/storefront-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4001}"
        INTERNAL_API_URL: "http://backend:4001"
    container_name: storefront-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - INTERNAL_API_URL=http://backend:4001
    ports:
      - "3000:3000"
